<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<title>Hộp-thư THPTTrinhHoaiDuc</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dán link Google Form của bạn vào href bên dưới -->
  <a class="mailbox" id="mailbox"
     href="https://forms.gle/9rMNjTLuJyyobhKYA"
     aria-label="Hộp thư màu đỏ, bấm để mở Google Form">
    <span class="float-icon fi-1">💌</span>
    <span class="float-icon fi-2">❤️</span>
    <span class="float-icon fi-3">✨</span>
    <span class="float-icon fi-4">💖</span>
    <span class="float-icon fi-5">✉️</span>
    <h1 class="school-name">
        <span class="deco deco-l">🏫</span> Trường THPT Trịnh Hoài Đức <span class="deco deco-r">🎓</span>
    </h1>
    
    <h2 class="school-name">TRƯỜNG THPT TRỊNH HOÀI ĐỨC</h2>
    <div class="letter"></div>
    <div class="body"></div>
    <div class="slot"></div>
    <div class="door"><span class="lock"></span></div>
    <div class="neck"></div>
    <div class="pole"></div>
    <div class="base"></div>

    <div class="caption">
        <p class="caption-title">
            <span class="ico-heart">💛</span><span class="shimmer">Nh&#7855;n g&#7917;i y&#234;u th&#432;&#417;ng</span><span class="ico-heart">💛</span>
        </p>
        <p class="caption-hint">
            <span class="ico-point">👆</span> (Bấm vào hòm thư để bắt đầu viết thư)
        </p>
    </div>
  </a>

  <script src="script.js"></script>
</body>
</html>
